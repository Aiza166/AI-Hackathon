name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege for the workflow token: CI only reads the code.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sahara
          POSTGRES_PASSWORD: sahara
          POSTGRES_DB: sahara_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sahara"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://sahara:sahara@localhost:5432/sahara_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  security:
    # Dependency audit (pip-audit, npm audit), static analysis (Bandit) and secret scan (gitleaks).
    # CodeQL needs GitHub Advanced Security on a private repo, so Bandit covers SAST here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks scans the whole history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: pip install pip-audit bandit
      - name: pip-audit (known vulnerable Python packages)
        run: pip-audit -r backend/requirements.txt --progress-spinner off
      - name: npm audit (high and critical)
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Bandit (Python SAST, medium+ severity and confidence)
        run: bandit -r backend/app -ll -ii -q
      - name: gitleaks (secrets in git history)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --redact --no-banner
