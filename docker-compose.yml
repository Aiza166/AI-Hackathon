# Local Postgres + Redis for development. Credentials are local-only defaults.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: sahara
      POSTGRES_PASSWORD: sahara
      POSTGRES_DB: sahara
    ports:
      - "127.0.0.1:5432:5432"  # local machine only
    volumes:
      - sahara_db:/var/lib/postgresql/data
  redis:
    image: redis:7
    # Local default password; set REDIS_PASSWORD (and REDIS_URL=redis://:<password>@localhost:6379/0) to change it.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-sahara-local}"]
    ports:
      - "127.0.0.1:6379:6379"  # local machine only
volumes:
  sahara_db:
